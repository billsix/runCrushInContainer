# Storage config for podman running *inside* this container (nested podman).
# Overlay-on-overlay under nested user namespaces is rejected by the kernel, so the
# inner podman must drive overlay through fuse-overlayfs, and /var/lib/containers must
# be backed by a NON-overlay filesystem. The Makefile provides that as either a host
# DISK directory bind mount (NESTED_PODMAN_STORE=dir, the default) or a RAM tmpfs
# (NESTED_PODMAN_STORE=tmpfs) -- both are real filesystems, so fuse-overlayfs runs on
# them. Pair this with the `make shell NESTED_PODMAN=1` run flags (--device /dev/fuse …).
[storage]
driver = "overlay"

[storage.options]
# Reuse images built OUTSIDE this sandbox WITHOUT copying them: the Makefile bind-mounts
# the host's rootless image store read-only at /var/lib/shared-images (when
# NESTED_PODMAN_HOST_IMAGESTORE points at it and it exists), and the inner podman reads it
# as a read-only additional store. A missing path here is tolerated (ignored), so this is
# harmless on a plain, non-nested run where nothing is mounted there. The writable layer
# still lives in the inner graphroot (the dir/tmpfs store above), never here.
additionalimagestores = [ "/var/lib/shared-images" ]

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
