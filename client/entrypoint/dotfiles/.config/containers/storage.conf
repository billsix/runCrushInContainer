# Storage config for podman running *inside* this container (nested podman).
# The inner podman uses the kernel's own overlay filesystem. It works here because the
# store, /var/lib/containers, is a NON-overlay filesystem: the Makefile backs it with a host
# DISK directory (NESTED_PODMAN_STORE=dir, the default) or a RAM tmpfs
# (NESTED_PODMAN_STORE=tmpfs). The kernel refuses an overlay whose upper dir sits on
# another overlay (the container's own root), so the store must never live there.
# Native overlay commits a layer by tarring its upper dir; fuse-overlayfs had no native
# diff and walked the whole image per commit (13 s against 62 s for the same build,
# 2026-11-15). Pair this with the `make shell NESTED_PODMAN=1` run flags, and with
# containers.conf.d/50-crush-nested.conf, which keeps buildah's temp files off the
# overlay root. Detail: tasks/reference/nested-podman-design.md ("Storage driver").
[storage]
driver = "overlay"

[storage.options]
# Reuse images built OUTSIDE this sandbox WITHOUT copying them: the Makefile bind-mounts
# the host's rootless image store read-only at /var/lib/shared-images (when
# NESTED_PODMAN_HOST_IMAGESTORE points at it and it exists), and the inner podman reads it
# as a read-only additional store. A missing path here is tolerated (ignored), so this is
# harmless on a plain, non-nested run where nothing is mounted there. The writable layer
# still lives in the inner graphroot (the dir/tmpfs store above), never here.
additionalimagestores = [ "/var/lib/shared-images" ]

[storage.options.overlay]
# containers-common's 00-vendor-rootful.conf drop-in sets "nodev,metacopy=on"; the
# kernel rejects metacopy in a user namespace, so this file (also installed as a later
# drop-in) overrides it.
mountopt = "nodev"
