# containers.conf drop-in for the nested podman (installed as
# /etc/containers/containers.conf.d/50-crush-nested.conf).
# buildah overlay-mounts each build's context under its temp dir, by default /var/tmp,
# which sits on this container's own overlay root, where the kernel refuses a native
# overlay ("mounting an overlay over build context directory … invalid argument").
# Keep those temp files on the store volume instead; client/entrypoint/shell.sh creates the dir.
[engine]
image_copy_tmp_dir = "/var/lib/containers/tmp"
